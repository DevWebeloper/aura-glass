name: Sync Traffic & Downloads

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The numbers live on their own branch. Committed to main, every daily
      # update was a new commit there, so every installed copy's update check
      # offered it as a new version of the theme.
      - name: Checkout stats branch
        uses: actions/checkout@v4
        with:
          ref: stats
          path: stats

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync traffic and release downloads
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          STATS_DIR: stats
        run: |
          python3 .github/scripts/update_traffic.py

      - name: Commit and push changes
        working-directory: stats
        run: |
          git config user.name "DevWebeloper"
          git config user.email "57136857+DevWebeloper@users.noreply.github.com"
          git add traffic/ badges/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update download and traffic stats [skip ci]"
            git push
          else
            echo "No changes in traffic or download stats."
          fi
