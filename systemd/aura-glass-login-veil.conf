# Drop-in for org.gnome.Shell@.service: see bin/aura-glass-login-veil.
# Every line is optional (the leading -), so a missing script or env file is the
# stock shell. systemd reads EnvironmentFile shortly before each process it
# spawns (systemd.exec(5)), so ExecStart sees what ExecStartPre just wrote on
# the same login. ExecStartPost (--started) runs only once ExecStart has
# succeeded (for this Type=notify unit, after READY=1): it clears the pending
# flag only on a stock login (empty env file). On an overlaid login the patched
# layout.js clears it when the veil's fade ends, so a shell that died after
# READY but before the fade finished still stands the next login down.
[Service]
ExecStartPre=-%h/.local/bin/aura-glass-login-veil
ExecStartPost=-%h/.local/bin/aura-glass-login-veil --started
EnvironmentFile=-%h/.cache/aura-glass/login-veil/env
