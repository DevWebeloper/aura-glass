# Solid mode — loaded on top of core.ini by --no-blur.
#
# Everything the glass look costs the GPU comes from one extension, and the
# expensive part is not evenly spread. Blur My Shell attaches a Gaussian shader
# per surface, and the panel's is the only one that is both always visible and
# always active: every other pipeline exists for the seconds a menu, the
# overview or the OSD is open. On top of that, hacks-level=2 turns off clipped
# redraws — the repo's own note in core.ini explains why it has to — and the
# cost of that is a full-screen repaint every frame, for everything.
#
# On the card this was developed on that is affordable. On an Intel iGPU or an
# older discrete card it is the difference between a desktop that feels light
# and one that does not, and neither of those is a card this project can test
# on. So rather than shipping a look that is only correct on fast hardware,
# --no-blur turns the shader off entirely and pays for the appearance with
# opaque surfaces instead.
#
# What this does NOT change: radii, spacing, the flat treatment, the accent,
# the icons, the window controls, the Adwaita-native toggles. Those are CSS and
# geometry, they cost nothing, and they are most of what this theme is.

[openbar]
# The bar is fully transparent in core.ini — bgalpha=0.0 — because every pixel
# of its appearance is the blur behind it. With the blur gone that reads as a
# hole in the desktop, so the bar has to paint itself. This is the single most
# important key in this file: without it --no-blur looks broken rather than
# plain.
bgalpha=1.0
bgalpha2=1.0
bgalpha-wmax=1.0
bgcolor=['0.086', '0.090', '0.106']
bgcolor2=['0.086', '0.090', '0.106']
bgcolor-wmax=['0.086', '0.090', '0.106']
# Off because it derives the bar colour from the wallpaper, which is a pleasant
# effect when the bar is glass and a muddy one when it is a solid slab.
bg-change=false

[custom-osd]
# 60 was chosen against a blur. Opaque now, for the same reason as the bar.
alpha=100.0

[blur-my-shell]
# Left at 0 rather than 2. Level 2 exists to stop blur actors going stale, and
# with no blur actors there is nothing to go stale — so the full-screen repaint
# it costs buys nothing at all here.
hacks-level=0

# Every component off. The extension itself is also dropped from
# enabled-extensions by install.sh in this mode, which is what actually removes
# the cost; these are set as well so that a user who re-enables the extension by
# hand gets a desktop that still looks deliberate rather than half-blurred.
[blur-my-shell/panel]
blur=false

[blur-my-shell/popup]
blur=false

[blur-my-shell/overview]
blur=false

[blur-my-shell/appfolder]
blur=false

[blur-my-shell/lockscreen]
blur=false

[blur-my-shell/window-list]
blur=false

[blur-my-shell/screenshot]
blur=false

[blur-my-shell/applications]
blur=false

[blur-my-shell/dash-to-dock]
blur=false
