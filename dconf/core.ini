# rounded-blur-found is deliberately absent. Blur My Shell writes it itself at
# every enable — true when the gnome-rounded-blur library is importable — and
# apply_popup_blur reads it to decide whether the popup blur can be dynamic.
# Listing it here would have dconf load stamp it back to false on every run,
# moments before that check.
settings-version=2
# Blur My Shell repaints only the region Clutter reports as damaged. The blur
# actor behind a window does not move when the window does, so nothing marks it
# dirty and it keeps showing the pixels that were under it when it was built —
# the overview looks like a screenshot taken a moment ago rather than a live
# blur. Level 2 turns clipped redraws off, which is the only thing that fixes
# it.
#
# It costs full-screen repaints. On integrated graphics that is a real battery
# and smoothness cost, so it is the one setting here worth turning back down
# (to 1) if a laptop feels warmer for it.
hacks-level=2

[blur-my-shell/appfolder]
blur=true
brightness=1.0
sigma=50
style-dialogs=2

[blur-my-shell/applications]
# Apps that draw their own window contents rather than letting the toolkit do
# it. This blur works by dropping the window actor to opacity=240 and putting a
# blur behind it, which assumes the app paints every pixel of itself. Chromium
# and Electron apps do not: wherever their own surface is transparent — the
# custom HTML title bar in Vesktop, for one — the blur shows through at full
# strength, while the pixels right below it are near solid. The result is a
# window that looks sliced horizontally. Blacklisting restores full opacity.
blacklist=['Plank', 'com.desktop.ding', 'Conky', 'Brave-browser', 'vesktop']
# Off as shipped, and turned on by install.sh only when --app-transparency is.
#
# This is the single most expensive thing this preset used to switch on, and
# almost none of it reached the screen. It blurs behind *every* window and
# rebuilds that blur as the window moves, while opacity=240 leaves the window
# 94% opaque and --app-transparency — the flag that makes the surfaces
# translucent enough to see any of it — is off by default and not part of
# --full.
#
# Measured on the live session, overview toggled six times, RX 7600:
#
#   blur=true    median  5%   p90 99%   max 100%
#   blur=false   median  2%   p90 28%   max  80%
#
# The overview is where it shows worst, because every window animates at once
# and each one's blur actor is rebuilt per frame. hacks-level was tested at 0,
# 1 and 2 with this off and moved the p90 by less than the noise between two
# identical runs, so it stays at 2 where it fixes a real staleness bug.
blur=false
blur-on-overview=false
brightness=1.0
# Matches `window { border-radius: 30px }` in the theme's libadwaita override.
# At 14 the blur was rounded to less than half what the window is, so a corner
# of blurred wallpaper sat outside the window on all four corners.
corner-radius=30
dynamic-opacity=false
enable-all=true
opacity=240
pipeline='pipeline_47391028465517'
sigma=12

