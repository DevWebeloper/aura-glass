# rounded-blur-found is deliberately absent. Blur My Shell writes it itself at
# every enable — true when the gnome-rounded-blur library is importable — and
# apply_popup_blur reads it to decide whether the popup blur can be dynamic.
# Listing it here would have dconf load stamp it back to false on every run,
# moments before that check.
settings-version=2
# Blur My Shell repaints only the region Clutter reports as damaged. The blur
# actor behind a window does not move when the window does, so nothing marks it
# dirty and it keeps showing the pixels that were under it when it was built —
# the overview looks like a screenshot taken a moment ago rather than a live
# blur. Level 2 turns clipped redraws off, which is the only thing that fixes
# it.
#
# It costs full-screen repaints. On integrated graphics that is a real battery
# and smoothness cost, so it is the one setting here worth turning back down
# (to 1) if a laptop feels warmer for it.
#
# It was 1 between 4790bfc and now, which was not a decision — the section was
# re-dumped from a live session that had it at 1, and the frozen blur came back
# with it.
hacks-level=2

[blur-my-shell/appfolder]
blur=true
brightness=1.0
sigma=50
style-dialogs=2

[blur-my-shell/applications]
# Whitelist mode: only native GNOME/GTK apps get blur shaders.
# Heavy web/Electron apps (Chrome, Discord, VS Code, Steam) are excluded to prevent high CPU/GPU load.
enable-all=false
whitelist=['org.gnome.Nautilus', 'org.gnome.Settings', 'gnome-control-center', 'org.gnome.TextEditor', 'org.gnome.SystemMonitor', 'org.gnome.Calculator', 'org.gnome.Extensions', 'org.gnome.Tweaks', 'org.gnome.Ptyxis', 'org.gnome.Console', 'gnome-terminal', 'org.gnome.DiskUtility', 'org.gnome.Logs', 'org.gnome.Calendar', 'org.gnome.Weather', 'org.gnome.Clocks', 'org.gnome.Characters', 'org.gnome.FontViewer', 'org.gnome.Loupe', 'org.gnome.Snapshot', 'io.bassi.Amberol', 'com.raggesilver.BlackBox']
blacklist=['*chrome*', '*google-chrome*', '*chromium*', '*discord*', '*vesktop*', '*brave*', '*firefox*', '*code*', '*antigravity*', '*steam*', '*spotify*', '*electron*', 'Plank', 'com.desktop.ding', 'Conky']
# On as shipped. apply_app_blur in lib/steps-dconf.sh writes this key on every
# run from the --window-blur flag and its memo, so the value here is only what
# a machine has between dconf load and that write.
#
# It is still the most expensive thing this preset switches on, and how much of
# it reaches the screen depends entirely on --app-transparency: at the default
# opacity=240 the window is 94% opaque and there is almost nothing to see
# behind it.
#
# Measured on the live session, overview toggled six times, RX 7600:
#
#   blur=true    median  5%   p90 99%   max 100%
#   blur=false   median  2%   p90 28%   max  80%
#
# The overview is where it shows worst, because every window animates at once
# and each one's blur actor is rebuilt per frame. hacks-level was tested at 0,
# 1 and 2 with this off and moved the p90 by less than the noise between two
# identical runs, so it stays at 2 where it fixes a real staleness bug.
#
# Those numbers predate patches/blur-my-shell-overview.patch, which stops the
# blur actors painting at all while the overview is up — so the worst case they
# measured is no longer being measured.
blur=true
# Upstream reads this only as "do not force window actors visible in the
# overview": the blur actor stays a child of the window, the previews clone it,
# and what they show is whatever was under the real window last time something
# repainted it. patches/blur-my-shell-overview.patch is what makes false mean
# no window blur in the overview.
blur-on-overview=false
brightness=1.0
# Matches `window { border-radius: 30px }` in the theme's libadwaita override.
# At 14 the blur was rounded to less than half what the window is, so a corner
# of blurred wallpaper sat outside the window on all four corners.
corner-radius=30
dynamic-opacity=false
opacity=240
pipeline='pipeline_47391028465517'
sigma=12

