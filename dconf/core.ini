rounded-blur-found=false
settings-version=2
# Blur My Shell repaints only the region Clutter reports as damaged. The blur
# actor behind a window does not move when the window does, so nothing marks it
# dirty and it keeps showing the pixels that were under it when it was built —
# the overview looks like a screenshot taken a moment ago rather than a live
# blur. Level 2 turns clipped redraws off, which is the only thing that fixes
# it.
#
# It costs full-screen repaints. On integrated graphics that is a real battery
# and smoothness cost, so it is the one setting here worth turning back down
# (to 1) if a laptop feels warmer for it.
hacks-level=2

