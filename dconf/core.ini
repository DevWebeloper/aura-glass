[blur-my-shell]
# Every blurred surface names one of these, and since Blur My Shell v76 the
# pipeline is the only place its radius and brightness live: the per-component
# sigma and brightness keys are read once, by v76's settings migration, and
# never again. Each surface has its own pipeline so the installer's writers
# (apply_blur_pipelines and apply_glass_style) can
# move one without the others.
#
# The radii are tokens/tokens.sh's TOKEN_BLUR_RADIUS_*, checked by
# tools/check-tokens.sh. No pipeline carries a `corner` effect: v76 cuts the
# corner inside the blur's own output pass, from each component's corner-radius
# key, and its migration strips corner effects from every pipeline.
#
# `maximized` starts as a copy of `windows` and names no component:
# patches/blur-my-shell-static-maximized.patch uses it for a window covering its
# monitor, by this id, while [applications] maximized-static-blur is on. An
# existing install gets it from apply_blur_pipelines, since load_dconf skips this
# file there.
pipelines={'pipeline_default': {'name': <'Default'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_000000000000'>, 'params': <{'unscaled_radius': <12.0>, 'brightness': <1.0>}>}>, <{'type': <'noise'>, 'id': <'effect_000000000003'>, 'params': <{'noise': <0.0>, 'lightness': <1.0>}>}>]>}, 'pipeline_13830698331882': {'name': <'dock'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_000000000006'>, 'params': <{'unscaled_radius': <8.0>, 'brightness': <1.0>}>}>]>}, 'pipeline_91827364550123': {'name': <'lock screen'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_000000000008'>, 'params': <{'unscaled_radius': <30.0>, 'brightness': <0.80000000000000004>}>}>, <{'type': <'noise'>, 'id': <'effect_000000000009'>, 'params': <{'noise': <0.0>, 'lightness': <1.01>}>}>]>}, 'pipeline_47391028465517': {'name': <'windows'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_000000000010'>, 'params': <{'unscaled_radius': <24.0>, 'brightness': <1.0>}>}>]>}, 'pipeline_28461903752846': {'name': <'popups'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_000000000012'>, 'params': <{'unscaled_radius': <60.0>, 'brightness': <1.0>}>}>]>}, 'pipeline_aura_glass_app_folders': {'name': <'app folders'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_000000000013'>, 'params': <{'unscaled_radius': <100.0>, 'brightness': <1.0>}>}>]>}, 'pipeline_aura_glass_window_list': {'name': <'window list'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_000000000014'>, 'params': <{'unscaled_radius': <60.0>, 'brightness': <0.59999999999999998>}>}>]>}, 'pipeline_aura_glass_maximized': {'name': <'maximized'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_000000000015'>, 'params': <{'unscaled_radius': <24.0>, 'brightness': <1.0>}>}>]>}}
# The pinned build's own settings version. Shipping it stops the extension's
# migration, which would otherwise run on first load over the values above: v76's
# step turns each component's legacy sigma into a new "Migrated dynamic blur"
# pipeline and repoints the component at it, out of reach of every writer named
# above, v77's (8) adds four stock pipelines no surface here names, 9 adds a
# fifth (pipeline_default_light, for the pipeline-auto-mode switch, off here)
# and 10 copies quick-settings-corner-radius into the new
# screenshot-corner-radius, which apply_radius_dconf writes itself.
# upgrade_bms_settings in lib/steps-dconf.sh brings an older install here.
settings-version=10
# v77 turns every blur off in Power Saver by default. The shell and GTK sheets
# stay translucent, so the glass would turn into bare see-through surfaces with
# no blur behind them. Adaptive performance owns battery behaviour here, and it
# moves the sheets and the blur together.
power-saver=false
# hacks-level is absent: Blur My Shell v76 removed it, and tracks what is
# behind each blur itself (render/backdrop/damage.js). v73 needed it at 2, a
# full-stage repaint every frame, or a window's blur kept showing the pixels
# that were under it when it was built.

[blur-my-shell/appfolder]
blur=true
pipeline='pipeline_aura_glass_app_folders'
style-dialogs=2

[blur-my-shell/applications]
# All-apps mode by default: blur covers every application window except the
# blacklist (--app-blur-scope all). The blacklist names the heavy web and
# Electron apps (Chrome, Discord, VS Code, Steam, Spotify): they redraw
# constantly, so the blur behind them is rebuilt constantly, which is high CPU
# and GPU load for little gain. Plank, ding and Conky draw desktop surfaces a
# blur actor sits wrongly against. Taking an app off the list (settings app
# Per-app blur, or "Blur This App") blurs it anyway; for those apps the blur
# shows only through the actor opacity apply_app_opacity sets, since they
# ignore the GTK stylesheet's alpha.
enable-all=true
whitelist=['org.gnome.Nautilus', 'org.gnome.Settings', 'gnome-control-center', 'org.gnome.TextEditor', 'org.gnome.SystemMonitor', 'org.gnome.Calculator', 'org.gnome.Extensions', 'org.gnome.Tweaks', 'org.gnome.Ptyxis', 'org.gnome.Console', 'gnome-terminal', 'org.gnome.DiskUtility', 'org.gnome.Logs', 'org.gnome.Calendar', 'org.gnome.Weather', 'org.gnome.Clocks', 'org.gnome.Characters', 'org.gnome.FontViewer', 'org.gnome.Loupe', 'org.gnome.Snapshot', 'io.bassi.Amberol', 'com.raggesilver.BlackBox']
blacklist=['*chrome*', '*google-chrome*', '*chromium*', '*discord*', '*vesktop*', '*brave*', '*firefox*', '*code*', '*antigravity*', '*steam*', '*spotify*', '*electron*', 'Plank', 'com.desktop.ding', 'Conky']
# On as shipped. apply_app_blur in lib/steps-dconf.sh writes this key on every
# run from the --window-blur flag and its memo, so the value here is only what
# a machine has between dconf load and that write.
#
# It is still the most expensive thing this preset switches on, and how much of
# it reaches the screen depends entirely on --app-transparency: at the default
# opacity=240 the window is 94% opaque and there is almost nothing to see
# behind it.
#
# Measured on the live session, overview toggled six times, RX 7600:
#
#   blur=true    median  5%   p90 99%   max 100%
#   blur=false   median  2%   p90 28%   max  80%
#
# The overview is where it shows worst, because every window animates at once
# and each one's blur actor is rebuilt per frame. v73's hacks-level, tested at
# 0, 1 and 2 with this off, moved the p90 by less than the noise between two
# identical runs.
#
# Those numbers predate the window blur leaving the overview (v73 with
# patches/blur-my-shell-overview.patch, v76 on its own), so the worst case they
# measured is no longer being measured.
blur=true
# False takes the window blur out of the overview. v73 read it only as "do not
# force window actors visible in the overview": the blur actor stayed a child of
# the window, the previews cloned it, and they showed whatever was under the real
# window last time something repainted it, until
# patches/blur-my-shell-overview.patch made false mean what it says. v76 does
# that itself (checked live on 2026-10-27: no frozen blur in the previews).
blur-on-overview=false
# Matches `window { border-radius: 30px }` in the theme's libadwaita override.
# At 14 the blur was rounded to less than half what the window is, so a corner
# of blurred wallpaper sat outside the window on all four corners.
corner-radius=30
dynamic-opacity=false
# A fullscreen window (a video in Chrome, a game) covers the whole monitor, so
# nothing behind it is visible to blur. Left false, the blur actor stayed up
# under it and the window kept the translucent actor opacity below, so a
# fullscreen YouTube video showed the frosted desktop through it. True hides the
# blur actor, turns its pipeline off and puts the window back at opacity 255
# (reconcile_window_visibility in components/applications.js) for as long as the
# window is fullscreen. apply_fullscreen_blur writes it every run as well, from
# --fullscreen-blur and its memo, since load_dconf skips this file on an
# existing install.
unblur-when-fullscreen=true
# True is the cheaper blur for the largest blurred area there is; the numbers are
# with TOKEN_BLUR_RADIUS_APPLICATIONS. apply_maximized_blur writes it every run as
# well, from --maximized-blur and its memo, for the reason just above.
maximized-static-blur=true
opacity=240
pipeline='pipeline_47391028465517'

[blur-my-shell/coverflow-alt-tab]
pipeline='pipeline_default'

# unblur-in-overview=false: the overview is the only place the native dash is on
# screen, so true hid its blur for good and the dash read as clear glass over the
# wallpaper. Upstream #1211 (in the pinned master) put the blur
# inside the dash so it frosts the app grid scrolling under it, which only shows
# with this off. static-blur stays false for the same reason: a static blur shows
# the wallpaper, not the grid, and it is what keeps the dash's offscreen cache in
# place, so liquid (which turns it on) gets the wallpaper there. Dash to Dock
# reads this key too and keeps its blur in the overview as well. Not yet measured
# on the live session against the overview numbers in [blur-my-shell/applications].
# #1208 and #1217 bring no keys, and #1218 needs none.
# override-background=false: with it on, style-dash-to-dock=0 adds Blur My Shell's
# .transparent-dash, whose !important clears any fill on #dash .dash-background.
# The overview behind the dash is already blurred, so this radius 8 blur has nothing
# left to soften there and the icons sat on no visible surface (seen 2026-11-01).
# Off, the dark fill in css/shell-00-flat.css and the theme's 28px radius show, and
# the blur still reads that radius from the same actor (get_dock_corners).
[blur-my-shell/dash-to-dock]
blur=true
override-background=false
pipeline='pipeline_13830698331882'
static-blur=false
style-dash-to-dock=0
unblur-in-overview=false

[blur-my-shell/dash-to-panel]
blur-original-panel=false

[blur-my-shell/hidetopbar]
compatibility=false

[blur-my-shell/lockscreen]
blur=true
pipeline='pipeline_91827364550123'

[blur-my-shell/overview]
blur=true
pipeline='pipeline_91827364550123'
# 0 adds no class. 1 was .overview-components-light: an !important pale fill and
# dark text on the search bar and results that the theme's white text and the dark
# fill in css/shell-00-flat.css could not reach (seen 2026-11-01).
style-components=0
# v77 replaces GNOME's hardcoded overview workspace corner with this key. A
# workspace reads as a large window of the desktop, so it takes the window's
# corner: at a sharper preset a 30px workspace around 10px windows is the
# mismatch the radius tokens exist to prevent. 30 is both TOKEN_RADIUS_WINDOW and
# the key's own default. apply_radius_dconf writes the preset's value over it.
workspace-corner-radius=30

[blur-my-shell/panel]
# The top bar draws through the lock screen pipeline, the one the overview
# background uses. unblur-in-overview takes the bar's own blur away when the
# overview opens, and the overview's blur of the same wallpaper shows in its
# place; with a pipeline of its own (radius 12 against 30, brightness 1.0
# against 0.8) that swap flashed a sharper, brighter strip, and every glass
# style, strength or brightness that reached one and not the other moved the
# seam again. One pipeline makes the two the same pixels whatever the
# writers do, so the top bar has no blur settings of its own.
blur=true
corner-radius=0
force-light-text=true
override-background=true
override-background-dynamically=false
pipeline='pipeline_91827364550123'
static-blur=true
style-panel=0
unblur-in-overview=true

# Menus, quick settings, notifications, dialogs, the alt-tab switcher and the
# volume/brightness OSD. This is the component introduced in upstream v73,
# built here from pinned v77.
#
# static-blur is false below and apply_popup_blur writes it false again on
# every run with popup blur on: the popup blur is always dynamic, whatever the
# machine has. v76 rounds its corners itself, in the Dual Kawase blur's output
# pass, from the radius keys below; it no longer uses the gnome-rounded-blur
# library.
#
# override-background is off on purpose. Blur My Shell's own popup stylesheet
# repaints menus and adds a 24px drop shadow, and that shadow is the one this
# desktop already removed once in 0dcb16c. css/shell-tweaks.css keeps the
# material; this section supplies only the blur and the shape behind it.
#
# The radii match the CSS exactly: see .popup-menu-content, .quick-settings and
# .notification-banner in css/shell-tweaks.css.
#
# A corner radius does NOT clamp. This was assumed for a long time and it is
# false: past half the blurred box's height the four corner arcs overlap and the
# rectangle collapses into a lens, which is what the OSD showed at 40 and, very
# plainly, at 100 — a soft ellipse floating behind the bar. So each has a hard
# ceiling of height/2. osd-corner-radius's 12 was found by bisecting from 0 (hard
# rectangle) and 25 (already bulging). Since v76 that key rounds the window and
# workspace switchers, and the volume and brightness popup has
# osd-window-corner-radius.
#
# osd-window-corner-radius and osd-window-rounded-corners are one design, so
# apply_osd_style overwrites both on every run from --osd-style: 20 and all corners
# for the capsule, 16 and the bottom two (2) for the tab. The second key is
# patches/blur-my-shell-osd-corners.patch's. Each radius equals the painted one in
# css/shell-00-flat.css, and the blur covers the popup exactly now (the popup is its
# own target, osd-window, in FULL_GEOMETRY_STYLE_CLASSES).
# Measured on the live session with notification banners, which go through this
# same component, eight fired over fourteen seconds, three runs each, RX 7600:
#
#   dynamic    median 4-9%   p90 12-14%   max 27-66%
#   off        median 5-6%   p90  8-11%   max 22-26%
#
# So the popup blur costs about four points of p90 and a spikier maximum. That
# is worth what it gives, and it is not what pegged the GPU — the window blur
# was, see [blur-my-shell/applications]. Dynamic against static came out inside
# the run-to-run noise (p90 48 vs 53 on one pass, and dynamic itself ranged 48
# to 21 across identical runs), so dynamic stays: it costs nothing measurable
# over static and samples the window behind a menu rather than the wallpaper.
[blur-my-shell/popup]
blur=true
static-blur=false
notification=true
pipeline='pipeline_28461903752846'
corner-radius=20
menu-corner-radius=26
quick-settings-corner-radius=33
notification-corner-radius=20
osd-corner-radius=12
osd-window-corner-radius=20
osd-window-rounded-corners=0
dialog-corner-radius=20
override-background=false
style-popup=2

[blur-my-shell/screenshot]
blur=true
pipeline='pipeline_default'

[blur-my-shell/window-list]
blur=true
pipeline='pipeline_aura_glass_window_list'

# [user-theme] is deliberately absent. The shell theme name is written by
# apply_gsettings alone (lib/steps-dconf.sh), because this file cannot carry it:
# it is loaded by a bare `dconf load` redirect, so nothing in it expands, and a
# hardcoded name here would overwrite the real one every run — in the window
# between that and apply_gsettings, install_css splices CSS into a theme the
# shell is not wearing. dconf load merges, so leaving it out simply means this
# preset does not touch the key.

# The volume and brightness popup, reduced to its level bar. osd-all is the
# combination the shell sends for volume (icon + device name + bar), which is
# where the device name comes from; osd-nolabel is brightness. osd-nolevel is
# left alone — those popups have no bar, so hiding the icon too would leave an
# empty pill.
#
# osd-style names the design, capsule or tab, and apply_osd_style writes it over
# this from the memo. The patch draws both designs with their icon and sizes them
# from css/shell-00-flat.css in logical pixels, so icon-all and icon-nolabel, size,
# hpadding, vpadding, levthickness, bradius and rotate only matter to a value of
# osd-style that is neither. The icon was hidden because upstream sizes it from
# the monitor, 72 px on a 1080p screen.
#
# bg-effect is 'none' on purpose, and it is the interesting part. Custom OSD's
# own dynamic-blur covers the actor's bounding box and knows nothing about
# border-radius, so the pill sat in a square patch of blur — which is exactly
# what it looked like on Intel graphics. Blur My Shell's popup component blurs
# the OSD instead (osd-window is one of its targets) and clips to
# osd-corner-radius, so the shape comes out right on every GPU without this
# project maintaining a shader of its own.
#
# So all this section paints now is a translucent capsule, and the blur under
# it comes from [blur-my-shell/popup].
[custom-osd]
osd-style='capsule'
osd-all={'icon-all': false, 'label-all': false, 'level-all': true, 'numeric-all': false}
osd-nolabel={'icon-nolabel': false, 'level-nolabel': true, 'numeric-nolabel': false}
osd-nolevel={'icon-nolevel': true, 'label-nolevel': true}
icon=false
label=false
level=true
numeric=false
bg-effect='none'
bgcolor=['0.11', '0.11', '0.12', '1.0']
# 45 was tuned against an unblurred wallpaper and read as a slab; 30 replaced
# it, but 30 was itself tuned while the popup blur was still falling back to
# static. Against the dynamic blur the pill turned nearly invisible, with the
# blur actor behind it showing through as a separate shape. 60 is the level
# that reads as glass rather than as a hole. The capsule and the tab keep it.
alpha=60.0
levcolor=['1.0', '1.0', '1.0', '1.0']
levalpha=95.0
levthickness=7.0
hpadding=10.0
vpadding=10.0
size=40.0
bradius=100.0
border=false
# Off because with bg-effect='none' Custom OSD takes its box-shadow branch, and
# a shadow around a translucent rounded pill reads as a dark rectangle stamped
# behind it — the same thing 0dcb16c removed from the menus.
shadow=false
# rotate and popup blur do not combine: Blur My Shell's blur actor is a sibling
# of the pill and does not rotate with it.
rotate=false
square-circle=false
horizontal=0.0
vertical=-38.0
monitors='all'
delay=1500.0
