# The volume and brightness popup, reduced to its level bar. osd-all is the
# combination the shell sends for volume (icon + device name + bar), which is
# where the device name comes from; osd-nolabel is brightness. osd-nolevel is
# left alone — those popups have no bar, so hiding the icon too would leave an
# empty pill.
#
# dynamic-blur is what puts the wallpaper blur behind it. It costs nothing at
# rest: the effect only exists while the popup is on screen.
[custom-osd]
osd-all={'icon-all': false, 'label-all': false, 'level-all': true, 'numeric-all': false}
osd-nolabel={'icon-nolabel': false, 'level-nolabel': true, 'numeric-nolabel': false}
osd-nolevel={'icon-nolevel': true, 'label-nolevel': true}
icon=false
label=false
level=true
numeric=false
bg-effect='dynamic-blur'
bgcolor=['0.11', '0.11', '0.12', '1.0']
alpha=45.0
levcolor=['1.0', '1.0', '1.0', '1.0']
levalpha=95.0
levthickness=7.0
hpadding=10.0
vpadding=10.0
size=40.0
bradius=100.0
border=false
shadow=true
rotate=false
square-circle=false
horizontal=0.0
vertical=-38.0
monitors='all'
delay=1500.0
