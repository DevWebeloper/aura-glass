[vitals]
hot-sensors=['_memory_usage_', '_system_load_1m_', '__network-rx_max__']

[hotedge]
fallback-in-use=false

[status-tray]
# The reference desktop's own order, carried over as-is. An app not named here
# just lands in discovery order, so entries for apps a machine lacks do nothing.
app-order=['Claude_status_icon_1', 'Cachy-Update', 'easyeffects', 'TelegramDesktop', 'discord_status_icon_1', 'shelly.shellyorg.Notifications', 'indicator-solaar', 'ollama-tray']
# Empty: the tuning this one icon carried here is now every icon's default
# (patch_status_tray_extension). Kept as a key so the merge clears the old
# shipped value from an install still on it; an icon tuned by hand keeps its own.
icon-effect-overrides=@a{ss} {}
# The reference desktop's overflow: on, as a strip of five, where the extension
# ships off, a popup menu, and four.
overflow-enabled=true
overflow-mode='strip'
overflow-strip-width=5

# Wiggly: the reference desktop's own shake tuning, carried over as-is so a
# fresh install shakes the same as the machine it was taken from.
# cursor-path is not here: it stays empty, so Wiggly draws the shape on screen
# (apply_wiggly_cursor resets it every run).
[wiggly]
distance-threshold=120
radians-threshold=5
sample-size=35
