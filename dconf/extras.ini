# tahoe-glass — optional extensions
#
# None of these are required for the look. They are the rest of the reference
# desktop: overview tuning, workspace pills and the dock.


[gnome-ui-tune]
always-show-thumbnails=true
hide-search=true
increase-thumbnails-size='300%'
overview-firefox-pip=true
restore-thumbnails-background=true

[just-perfection]
support-notifier-showed-version=36
support-notifier-type=0

[space-bar/appearance]
active-workspace-border-radius=100
active-workspace-border-width=0
active-workspace-padding-h=9
active-workspace-padding-v=4
application-styles='.space-bar {\n  -natural-hpadding: 6px;\n}\n\n.space-bar-workspace-label.active {\n  margin: 0 4px;\n  background-color: rgba(255,255,255,0.3);\n  color: rgba(255,255,255,1);\n  border-color: rgba(0,0,0,0);\n  font-weight: 700;\n  border-radius: 100px;\n  border-width: 0px;\n  padding: 4px 9px;\n}\n\n.space-bar-workspace-label.inactive {\n  margin: 0 4px;\n  background-color: rgba(0,0,0,0);\n  color: rgba(255,255,255,1);\n  border-color: rgba(0,0,0,0);\n  font-weight: 700;\n  border-radius: 100px;\n  border-width: 0px;\n  padding: 4px 9px;\n}\n\n.space-bar-workspace-label.inactive.empty {\n  margin: 0 4px;\n  background-color: rgba(0,0,0,0);\n  color: rgba(255,255,255,0.5);\n  border-color: rgba(0,0,0,0);\n  font-weight: 700;\n  border-radius: 100px;\n  border-width: 0px;\n  padding: 4px 9px;\n}'
empty-workspace-border-radius=100
empty-workspace-border-width=0
empty-workspace-padding-h=9
empty-workspace-padding-v=4
inactive-workspace-border-radius=100
inactive-workspace-border-width=0
inactive-workspace-padding-h=9
inactive-workspace-padding-v=4
workspace-margin=4
workspaces-bar-padding=6

[dash-to-dock]
always-center-icons=true
application-counter-overrides-notifications=true
apply-custom-theme=false
autohide=true
background-opacity=0.10000000000000001
click-action='cycle-windows'
custom-background-color=false
custom-theme-shrink=false
dance-urgent-applications=true
dash-max-icon-size=42
disable-overview-on-startup=false
dock-fixed=false
dock-position='BOTTOM'
extend-height=false
height-fraction=0.80000000000000004
hide-tooltip=false
hot-keys=false
icon-size-fixed=false
intellihide=true
isolate-locations=true
isolate-monitors=false
isolate-workspaces=false
multi-monitor=true
preview-size-scale=0.17999999999999999
running-indicator-style='DOT'
scroll-action='switch-workspace'
scroll-to-focused-application=true
show-apps-always-in-the-edge=true
show-apps-at-top=true
show-favorites=true
show-icons-emblems=true
show-icons-notifications-counter=true
show-mounts=false
show-mounts-network=false
show-mounts-only-mounted=false
show-running=true
show-show-apps-button=true
show-trash=true
show-windows-preview=true
transparency-mode='FIXED'
workspace-agnostic-urgent-windows=true
